name: LeaveSim
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  LeaveSim:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LeaveSim
    settings:
      base:
        PRODUCT_NAME: LeaveSim
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LeaveSim
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 请假
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存截图需要访问相册
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择头像需要访问相册
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets: []
