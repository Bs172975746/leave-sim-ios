workflows:
  ios-unsigned:
    name: LeaveSim 未签名 ipa
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        SCHEME: LeaveSim
        APP_NAME: LeaveSim
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 工程自检（缺 .xcodeproj 就用 XcodeGen 重建）
        script: |
          set -e
          ls -la
          if [ ! -d "LeaveSim.xcodeproj" ]; then
            echo "没有 .xcodeproj，用 project.yml 生成"
            brew install xcodegen
            xcodegen generate
          fi
          python3 tools/check_project.py || true
      - name: 编译（不签名）
        script: |
          set -e
          xcodebuild -version
          xcodebuild -project LeaveSim.xcodeproj -list
          xcodebuild \
            -project LeaveSim.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: 打成未签名 ipa
        script: |
          set -e
          APP="build/Build/Products/Release-iphoneos/${APP_NAME}.app"
          test -d "$APP"
          rm -rf Payload "${APP_NAME}-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          ls -l "${APP_NAME}-unsigned.ipa"
    artifacts:
      - LeaveSim-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
